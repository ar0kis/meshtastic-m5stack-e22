[env:m5stack-core-e22]
custom_meshtastic_hw_model = 42
custom_meshtastic_hw_model_slug = M5STACK
custom_meshtastic_architecture = esp32
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = M5Stack Core Basic + E22
custom_meshtastic_tags = DIY,M5Stack

extends = esp32_base
board_level = extra
board = m5stack-core-esp32
upload_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter =
  ${esp32_base.build_src_filter}
build_flags =
  ${esp32_base.build_flags}
  -I variants/esp32/diy/m5stack_core_e22
  -DM5STACK
  -DMESHTASTIC_EXCLUDE_WIFI=1
  -DMESHTASTIC_EXCLUDE_MQTT=1
  -DMESHTASTIC_EXCLUDE_WEBSERVER=1
  ; The Mac client requests a filesystem manifest during initial BLE sync.
  ; On classic ESP32 this caused a transient heap exhaustion and reboot.
  -DMESHTASTIC_EXCLUDE_FILES_MANIFEST=1
  ; Avoid heap-allocating packet pretty-printer strings while BLE is sending
  ; the full node/config database. Normal INFO/WARN/ERROR logs remain enabled.
  -DDEBUG_MUTE
  -DMESHTASTIC_EXCLUDE_PAXCOUNTER=1
  -DMESHTASTIC_EXCLUDE_TFT_COLORING=1
  -DMESHTASTIC_EXCLUDE_COMMON_HEADER=1
  -DMESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
  -DMESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  -DMESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1
  -DMESHTASTIC_EXCLUDE_EXTERNALNOTIFICATION=1
  -DMESHTASTIC_EXCLUDE_STOREFORWARD=1
  -DMESHTASTIC_EXCLUDE_NEIGHBORINFO=1
  -DUSER_SETUP_LOADED
  -DTFT_SDA_READ
  -DTFT_DRIVER=0x9341
  -DTFT_MISO=19
  -DTFT_MOSI=23
  -DTFT_SCLK=18
  -DTFT_CS=14
  -DTFT_DC=27
  -DTFT_RST=33
  -DTFT_BL=32
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=16000000
lib_ignore =
  m5stack-core
lib_deps =
  ${esp32_base.lib_deps}
  lovyan03/LovyanGFX@1.2.26

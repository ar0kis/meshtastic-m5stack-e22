[SuperMini_C3_E22_M22S]
extends = esp32_base
board = esp32-c3-devkitm-1
board_build.flash_size = 4MB
build_unflags =
  -D LORA_FREQ=869.618
build_flags =
  ${esp32_base.build_flags}
  -I variants/supermini_c3_e22_m22s
  -I variants/xiao_c3
  -D ESP32_CPU_FREQ=160
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D P_LORA_NSS=1
  -D P_LORA_SCLK=0
  -D P_LORA_MOSI=2
  -D P_LORA_MISO=3
  -D P_LORA_DIO_1=21
  -D P_LORA_BUSY=4
  -D P_LORA_RESET=10
  -D SX126X_TXEN=7
  -D SX126X_RXEN=6
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/supermini_c3_e22_m22s>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}

[env:supermini_c3_e22_m22s_repeater_observer_mqtt]
extends = SuperMini_C3_E22_M22S
board_build.partitions = min_spiffs.csv
extra_scripts =
  ${esp32_base.extra_scripts}
  pre:scripts/generate_cert_bundle.py
board_ssl_cert_source = adafruit-full
board_build.embed_files = src/certs/x509_crt_bundle.bin
build_flags =
  ${SuperMini_C3_E22_M22S.build_flags}
  -D ADVERT_NAME='"SNodeREP-1"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D WITH_MQTT_BRIDGE=1
  -D MQTT_NEIGHBORS_WITHOUT_PSRAM=1
  -D MQTT_MAX_PACKET_SIZE=1024
  -D CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y
  -D LORA_FREQ=869.05
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D LORA_CR=7
  -D LORA_TX_POWER=22
  -D MAX_LORA_TX_POWER=22
build_src_filter = ${SuperMini_C3_E22_M22S.build_src_filter}
  +<helpers/bridges/MQTTBridge.cpp>
  +<helpers/MQTTMessageBuilder.cpp>
  +<helpers/JWTHelper.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${SuperMini_C3_E22_M22S.lib_deps}
  ${esp32_ota.lib_deps}
  elims/PsychicMqttClient@^0.2.4
  bblanchon/ArduinoJson @ 7.4.3
  arduino-libraries/NTPClient
  JChristensen/Timezone
  paulstoffregen/Time@1.6.1

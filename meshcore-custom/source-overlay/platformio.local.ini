[M5Stack_Core_E22]
extends = esp32_base
board = m5stack-core-esp32-16M
board_build.partitions = default_16MB.csv
upload_speed = 115200
build_flags =
  ${esp32_base.build_flags}
  -I variants/m5stack-core-e22
  -D M5STACK_CORE_E22
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_DIO_1=36
  -D P_LORA_NSS=26
  -D P_LORA_RESET=25
  -D P_LORA_BUSY=35
  -D P_LORA_SCLK=18
  -D P_LORA_MISO=19
  -D P_LORA_MOSI=23
  -D SX126X_RXEN=2
  -D SX126X_TXEN=5
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D LORA_TX_POWER=22
  -D MAX_LORA_TX_POWER=22
  -D PIN_BOARD_SDA=21
  -D PIN_BOARD_SCL=22
  -D PIN_USER_BTN=38
  -D DISPLAY_CLASS=M5StackILI9341Display
  -D PIN_TFT_CS=14
  -D PIN_TFT_DC=27
  -D PIN_TFT_RST=33
  -D PIN_TFT_BACKLIGHT=32
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/m5stack-core-e22>
  +<helpers/ui/MomentaryButton.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  adafruit/Adafruit ILI9341 @ ^1.6.2
  olikraus/U8g2_for_Adafruit_GFX @ ^1.8.0

[env:m5stack_core_e22_observer_mqtt]
extends = M5Stack_Core_E22
build_unflags =
  -D LORA_FREQ=869.618
  -D LORA_SF=8
build_flags =
  ${M5Stack_Core_E22.build_flags}
  -D LORA_FREQ=869.05
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=7
  -D ADVERT_NAME='"M5Stack E22 Observer"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D WITH_MQTT_BRIDGE=1
  -D MAX_MQTT_BROKERS=3
  -D MQTT_MAX_PACKET_SIZE=1024
  -D MQTT_DEBUG=1
  -D MQTT_MEMORY_DEBUG=1
  -D MESH_PACKET_LOGGING=1
  -D MESH_DEBUG=1
  -D CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y
  -D MQTT_WIFI_TX_POWER=WIFI_POWER_19_5dBm
  -D MQTT_WIFI_POWER_SAVE_DEFAULT=1
build_src_filter = ${M5Stack_Core_E22.build_src_filter}
  +<helpers/bridges/MQTTBridge.cpp>
  +<helpers/MQTTMessageBuilder.cpp>
  +<helpers/JWTHelper.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${M5Stack_Core_E22.lib_deps}
  ${esp32_ota.lib_deps}
  elims/PsychicMqttClient@^0.2.4
  bblanchon/ArduinoJson
  arduino-libraries/NTPClient
  JChristensen/Timezone
  paulstoffregen/Time@1.6.1

[env:m5stack_core_e22_companion_ble_rus]
extends = M5Stack_Core_E22
build_unflags =
  -D LORA_FREQ=869.618
  -D LORA_SF=8
build_flags =
  ${M5Stack_Core_E22.build_flags}
  -I examples/companion_radio/ui-new
  -D LORA_FREQ=869.05
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=7
  -D INIT_TJM_RADIO_PROFILE_V1=1
  -D MAX_CONTACTS=160
  -D MAX_GROUP_CHANNELS=8
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=128
  -D AUTO_OFF_MILLIS=30000
build_src_filter = ${M5Stack_Core_E22.build_src_filter}
  -<helpers/JWTHelper.cpp>
  -<helpers/MQTTMessageBuilder.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${M5Stack_Core_E22.lib_deps}
  densaugeo/base64 @ ~1.4.0

[SuperMini_C3_E22]
extends = esp32_base
board = esp32-c3-devkitm-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
build_unflags =
  -D LORA_FREQ=869.618
  -D LORA_SF=8
build_flags =
  ${esp32_base.build_flags}
  -I variants/xiao_c3
  -D ESP32_CPU_FREQ=80
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D P_LORA_NSS=10
  -D P_LORA_SCLK=4
  -D P_LORA_MOSI=6
  -D P_LORA_MISO=5
  -D P_LORA_DIO_1=3
  -D P_LORA_BUSY=1
  -D P_LORA_RESET=0
  -D SX126X_TXEN=20
  -D SX126X_RXEN=21
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/xiao_c3>
  +<helpers/sensors>
  -<helpers/JWTHelper.cpp>
  -<helpers/MQTTMessageBuilder.cpp>
lib_deps =
  ${esp32_base.lib_deps}

[env:supermini_c3_e22_repeater_tjm]
extends = SuperMini_C3_E22
build_src_filter = ${SuperMini_C3_E22.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${SuperMini_C3_E22.build_flags}
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D SX126X_RX_BOOSTED_GAIN=1
  -D LORA_FREQ=869.05
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=7
  -D LORA_TX_POWER=22
  -D MAX_LORA_TX_POWER=22
  -D ADVERT_NAME='"C3 E22 Repeater TJM"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D MESH_DEBUG=1
  -D RADIOLIB_DEBUG_BASIC=1
lib_deps =
  ${SuperMini_C3_E22.lib_deps}
  ${esp32_ota.lib_deps}

[SuperMini_C3_E22_M22S]
extends = esp32_base
board = esp32-c3-devkitm-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
build_unflags =
  -D LORA_FREQ=869.618
build_flags =
  ${esp32_base.build_flags}
  -I variants/xiao_c3
  -D ESP32_CPU_FREQ=80
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D PIN_BOARD_SDA=9
  -D PIN_BOARD_SCL=10
  -D P_LORA_NSS=8
  -D P_LORA_SCLK=2
  -D P_LORA_MOSI=4
  -D P_LORA_MISO=3
  -D P_LORA_DIO_1=6
  -D P_LORA_BUSY=7
  -D P_LORA_RESET=5
  -D SX126X_TXEN=20
  -D SX126X_RXEN=1
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_FREQ_CORRECTION_MHZ=0.0f
  -D SX126X_CURRENT_LIMIT=140
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/xiao_c3>
  +<helpers/sensors>
  -<helpers/JWTHelper.cpp>
  -<helpers/MQTTMessageBuilder.cpp>
lib_deps =
  ${esp32_base.lib_deps}

[env:supermini_c3_e22_m22s_repeater_snode]
extends = SuperMini_C3_E22_M22S
build_src_filter = ${SuperMini_C3_E22_M22S.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${SuperMini_C3_E22_M22S.build_flags}
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D SX126X_RX_BOOSTED_GAIN=1
  -D LORA_FREQ=869.05
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D LORA_CR=7
  -D LORA_TX_POWER=22
  -D MAX_LORA_TX_POWER=22
  -D ADVERT_NAME='"SNode_rep"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D MESH_DEBUG=1
  -D RADIOLIB_DEBUG_BASIC=1
lib_deps =
  ${SuperMini_C3_E22_M22S.lib_deps}
  ${esp32_ota.lib_deps}
